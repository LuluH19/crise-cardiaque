name: Lancer un job d'entrainement
on:
  workflow_dispatch:
    inputs:
      class_weight:
        description: Ponderation des classes
        type: choice
        options:
          - balanced
          - none
        default: balanced
permissions:
  id-token: write
  contents: read
jobs:
  entrainement:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4
      - name: Se connecter a Azure (sans mot de passe)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Installer l'extension Azure ML
        run: az extension add -n ml
      - name: Lancer le job et attendre la fin
        timeout-minutes: 60
        env:
          CLASS_WEIGHT: ${{ inputs.class_weight }}
        run: |
          JOB_NAME=$(az ml job create \
            --file jobs/train-job.yml \
            --resource-group rg-iwid-luca \
            --workspace-name mlw-iwid-luca \
            --set inputs.class_weight="$CLASS_WEIGHT" \
            --query name -o tsv | tail -n 1)
          if [ -z "$JOB_NAME" ]; then
            echo "Le job n'a pas pu etre cree"
            exit 1
          fi
          echo "Job soumis : $JOB_NAME"
          while true; do
            STATUT=$(az ml job show -n "$JOB_NAME" \
              --resource-group rg-iwid-luca \
              --workspace-name mlw-iwid-luca \
              --query status -o tsv 2>/dev/null | tail -n 1)
            echo "$(date +%H:%M:%S) - ${STATUT:-statut indisponible}"
            case "$STATUT" in
              Completed) exit 0 ;;
              Failed|Canceled) exit 1 ;;
            esac
            sleep 30
          done
