name: Lancer un job d'entrainement
on:
  workflow_dispatch:
    inputs:
      class_weight:
        description: Ponderation des classes
        type: choice
        options:
          - balanced
          - none
        default: balanced
permissions:
  id-token: write
  contents: read
jobs:
  entrainement:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code du depot
        uses: actions/checkout@v4
      - name: Se connecter a Azure (sans mot de passe)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Installer l'extension Azure ML
        run: az extension add -n ml
      - name: Lancer le job et suivre ses logs
        env:
          CLASS_WEIGHT: ${{ inputs.class_weight }}
        run: |
          az ml job create \
            --file jobs/train-job.yml \
            --resource-group rg-iwid-luca \
            --workspace-name mlw-iwid-luca \
            --set inputs.class_weight="$CLASS_WEIGHT" \
            --stream
